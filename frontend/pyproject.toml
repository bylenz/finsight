[project]
name = "finsight-ui"
version = "0.1.0"
description = "FinSight Streamlit UI"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.37",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pandas>=2.2",
    "plotly>=5.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight_ui"]
