services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - finsight
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight}
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - finsight
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@db:5432/${POSTGRES_DB:-finsight}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      BASE_CURRENCY: ${BASE_CURRENCY:-PEN}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - finsight
    environment:
      BACKEND_URL: http://web:8000
    ports:
      - "8501:8501"
    depends_on:
      - web

  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - finsight

volumes:
  db_data:

networks:
  finsight:
    driver: bridge
