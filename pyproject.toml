[project]
name = "finsight"
version = "0.1.0"
description = "FinSight — AI-powered personal finance tracker for LATAM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FinSight Team" }]
dependencies = []

[tool.uv.workspace]
members = ["backend", "frontend"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
    "aiosqlite>=0.20",
    "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT", "RUF"]
# B008: Depends() / Query() in defaults is FastAPI's idiomatic dependency injection.
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "frontend/tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["backend/src/finsight"]
omit = ["*/migrations/*", "*/tests/*"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
