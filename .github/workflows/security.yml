# Security scanning workflow — allow_failure-first gating policy.
#
# ALL jobs run with continue-on-error: true in this initial phase.
# The intent is: green + evidence on first merge, no false-positive blockers.
# Tightening plan (separate change): remove continue-on-error per job once
# baselines are triaged, then raise Trivy exit-code to 1.
#
# Job trigger classes:
#   Light  (push/PR to main|develop): secret-scan, sast, sca
#   Heavy  (main push | weekly cron | manual dispatch): image-scan, dast

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # secret-scan — Gitleaks + TruffleHog (light: push/PR only)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare reports directory
        run: mkdir -p reports

      # Docker-run instead of the action wrapper: gitleaks-action@v2 is
      # env-configured and ignores a custom JSON report path. Docker guarantees
      # reports/gitleaks-report.json materializes for the DefectDojo upload.
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.27.2 \
            detect --source /repo \
            --report-format json \
            --report-path /repo/reports/gitleaks-report.json \
            --exit-code 0 || true

      # Docker-run with an explicit shell redirect: the trufflehog action passes
      # extra_args verbatim to the container, so a `>` inside extra_args is never
      # evaluated. filesystem mode = whole-tree (pre-commit hook scans staged only).
      - name: TruffleHog
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/trufflesecurity/trufflehog:3.90.8 \
            filesystem /repo --results=verified,unknown --json 2>/dev/null \
            > reports/trufflehog-report.json || true

      - name: Upload secret-scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: reports/

  # ---------------------------------------------------------------------------
  # sast — Semgrep + Bandit (light: push/PR only)
  # ---------------------------------------------------------------------------
  sast:
    name: SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Semgrep
        run: |
          pipx run semgrep scan \
            --config p/ci \
            --config p/security-audit \
            --config p/python \
            --json \
            --output reports/semgrep-report.json \
            backend/src/finsight || true

      - name: Bandit
        run: |
          pipx run bandit \
            -r backend/src/finsight \
            -f json \
            -o reports/bandit-report.json || true

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/

  # ---------------------------------------------------------------------------
  # sca — Trivy filesystem scan + CycloneDX SBOM (light: push/PR only)
  # ---------------------------------------------------------------------------
  sca:
    name: SCA
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/trivy-fs-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/sbom.json

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: reports/

  # ---------------------------------------------------------------------------
  # image-scan — Trivy image scan (heavy: main push | cron | dispatch)
  # ---------------------------------------------------------------------------
  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build Docker image
        run: docker build -t finsight-web:ci ./backend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: finsight-web:ci
          format: json
          output: reports/trivy-image-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload image-scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-reports
          path: reports/

  # ---------------------------------------------------------------------------
  # dast — OWASP ZAP baseline scan (heavy: main push | cron | dispatch)
  # ---------------------------------------------------------------------------
  dast:
    name: DAST
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Start application stack
        run: docker compose up -d --build web db

      - name: Wait for application to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "App ready" && break
            echo "Waiting ($i/30)..."; sleep 5
          done

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8000
          fail_action: false
          cmd_options: '-J reports/zap-report.json'

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs web

      - name: Tear down application stack
        if: always()
        run: docker compose down

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: reports/
